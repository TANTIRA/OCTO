# OCTO application stack — Dokploy compose project
# Deploy alongside the supabase project (infra/supabase/). Both attach to
# the shared external "data" network so api can reach Postgres and Storage.
# Secrets are injected via Dokploy project env — never commit .env.

name: octo

networks:
  app:
    driver: bridge
  data:
    external: true
    name: ${DATA_NETWORK:-supabase_default}
  dokploy-network:
    external: true

services:

  api:
    image: ${REGISTRY_URL:?set REGISTRY_URL}/octo-api:${API_IMAGE_TAG:?set API_IMAGE_TAG — a pinned sha or semver tag, never latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      # No SUPABASE_* or NEO4J_* here: nothing in the api reads them (#340). The service key bypasses
      # RLS, so holding it only widens the blast radius; a feature that needs storage or the graph adds
      # the narrow credential it actually reads (user-JWT passthrough, scoped key, graph user) in its own PR.
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-authenticated}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DECISION_MODEL: ${DECISION_MODEL:-}
      DECISION_MODEL_ENDPOINT: ${DECISION_MODEL_ENDPOINT:-}
      # Helius (Solana onchain ingestion) — conditional on HELIUS_RPC_URL
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-}
      HELIUS_WALLET_API_URL: ${HELIUS_WALLET_API_URL:-}
      HELIUS_NETWORK: ${HELIUS_NETWORK:-}
      HELIUS_WEBHOOK_SECRET: ${HELIUS_WEBHOOK_SECRET:-}
      # Alpha Vantage (market data ingestion) — conditional on ALPHA_VANTAGE_API_KEY
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ALPHA_VANTAGE_BASE_URL: ${ALPHA_VANTAGE_BASE_URL:-}
      # Agents sidecar — conditional on OCTO_AGENTS_BASE_URL
      OCTO_AGENTS_BASE_URL: ${OCTO_AGENTS_BASE_URL:-}
      OCTO_AGENTS_TOKEN: ${OCTO_AGENTS_TOKEN:-}
      # Platform admin provisioning — comma-separated JWT subjects
      OCTO_PLATFORM_ADMINS: ${OCTO_PLATFORM_ADMINS:-}
      # Redis quota counters — conditional on REDIS_HOST
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
    networks:
      - app
      - data
      # Public API domain assigned in Dokploy UI → Traefik/TLS handled by Dokploy
      - dokploy-network
    healthcheck:
      # Readiness, not the aggregate: the database is in the readiness group (docs/reliability.md §4).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  web:
    image: ${REGISTRY_URL:?set REGISTRY_URL}/octo-web:${WEB_IMAGE_TAG:?set WEB_IMAGE_TAG — a pinned sha or semver tag, never latest}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_PUBLIC_URL}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL}
    networks:
      - app
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Public domain assigned in Dokploy UI → Traefik/TLS handled by Dokploy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

# Graph store: the external octo-neo4j Dokploy service (bolt :7687 on
# dokploy-network). It lives outside this compose so Browser and the app share
# one graph; bolt stays private — Traefik only exposes labelled HTTP services.
