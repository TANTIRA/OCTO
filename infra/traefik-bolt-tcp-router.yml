# Traefik dynamic config for TLS-terminating TCP router (Bolt)
# Place this in /etc/dokploy/traefik/dynamic/ on the Dokploy host
# or configure via Dokploy's static Traefik config if using provider: file

tcp:
  routers:
    bolt-tls-router:
      # Route public bolt+s connections to the internal Neo4j service
      entryPoints:
        - bolt  # Must be defined in Traefik static config (see below)
      service: bolt-service
      tls:
        certResolver: letsencrypt  # Use Traefik's ACME resolver
        # OR use a static cert (if Let's Encrypt not available):
        # domains:
        #   - main: bolt-octo.mesta.click
        domains:
          - main: bolt-octo.mesta.click  # Primary domain for the certificate
            # sans:
            #   - "*.bolt-octo.mesta.click"
  
  services:
    bolt-service:
      # Forward TLS-decrypted traffic to the internal Neo4j Bolt port
      loadBalancer:
        servers:
          - address: octo-neo4j-db:7687  # Internal docker service name
        # terminationDelay allows graceful shutdown of existing connections (seconds)
        terminationDelay: 30

  # Optional: TCP middleware for auth or logging
  # middlewares:
  #   bolt-auth:
  #     basicAuth:
  #       users:
  #         - "neo4j:$2y$05$..."  # bcrypt hash; use htpasswd to generate
  #         # Apply with: routers.bolt-tls-router.middlewares: ["bolt-auth@file"]
