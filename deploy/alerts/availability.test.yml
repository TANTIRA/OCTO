    - exp_labels:
        severity: ticket
        slo: availability
        job: octo-api
        deployment: test
      exp_annotations: *id002
- name: error ratio survives one replica counter reset
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{job="octo-api",deployment="test",instance="api:8081",uri="/api/v1/prospects",status="200",method="GET"}
    values: 0+980x470 0+980x9
  - series: http_server_requests_seconds_count{job="octo-api",deployment="test",instance="api:8081",uri="/api/v1/prospects",status="500",method="GET"}
    values: 0+20x470 0+20x9
  - series: http_server_requests_seconds_count{job="octo-api",deployment="test",instance="api-2:8081",uri="/api/v1/prospects",status="200",method="GET"}
    values: 0+980x480
  - series: http_server_requests_seconds_count{job="octo-api",deployment="test",instance="api-2:8081",uri="/api/v1/prospects",status="500",method="GET"}
    values: 0+20x480
  alert_rule_test:
  - eval_time: 8h
    alertname: OctoAvailabilityBurnFast
    exp_alerts:
    - exp_labels:
        severity: page
        slo: availability
        job: octo-api
        deployment: test
      exp_annotations: *id003
  - eval_time: 8h
    alertname: OctoAvailabilityBurnSlow
    exp_alerts:
    - exp_labels:
