        slo: availability
        job: octo-api
        deployment: test
      exp_annotations: *id001
  - eval_time: 8h
    alertname: OctoAvailabilityBurnTicket
    exp_alerts:
    - exp_labels:
        severity: ticket
        slo: availability
        job: octo-api
        deployment: test
      exp_annotations: *id002
  promql_expr_test:
  - expr: abs(octo:availability_error_ratio:rate1h - 0.02) < bool 1e-12
    eval_time: 8h
    exp_samples:
    - labels: '{job="octo-api",deployment="test"}'
      value: 1
