        job: octo-api
        deployment: test
      exp_annotations: *id001
  - eval_time: 80h
    alertname: OctoAvailabilityBurnTicket
    exp_alerts:
    - exp_labels:
        severity: ticket
        slo: availability
        job: octo-api
        deployment: test
      exp_annotations: *id002
- name: counter reset on one replica does not page
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{job="octo-api",deployment="test",instance="api:8081",uri="/api/v1/prospects",status="200",method="GET"}
    values: 0+1000x4790 0+1000x9
  - series: http_server_requests_seconds_count{job="octo-api",deployment="test",instance="api-2:8081",uri="/api/v1/prospects",status="200",method="GET"}
    values: 0+1000x4800
  alert_rule_test:
  - eval_time: 80h
    alertname: OctoAvailabilityBurnFast
    exp_alerts: []
  - eval_time: 80h
    alertname: OctoAvailabilityBurnSlow
    exp_alerts: []
  - eval_time: 80h
    alertname: OctoAvailabilityBurnTicket
    exp_alerts: []
- name: at fast threshold only lower thresholds fire
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{job="octo-api",deployment="test",instance="api:8081",uri="/api/v1/prospects",status="200",method="GET"}
    values: 0+9856x4800
  - series: http_server_requests_seconds_count{job="octo-api",deployment="test",instance="api:8081",uri="/api/v1/prospects",status="500",method="GET"}
