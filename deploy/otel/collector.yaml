# OTEL collector base config (#306) — mounted by the otel-collector service in deploy/dokploy.compose.yml.
# Exporters come from one overlay chosen by OTELCOL_EXPORT (export-<name>.yaml in this directory); the
# collector merges --config files in order, and a later file's list replaces an earlier one's, so the
# overlay's `exporters:` lists win. Default overlay is export-debug.yaml: nothing leaves the host.

receivers:
  # Traces (and any OTLP metrics) pushed by the api: MANAGEMENT_OTLP_TRACING_ENDPOINT → :4318/v1/traces.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Pull the api's Micrometer registry from its internal scrape port (#338, MetricsPortConfig).
  # http_server_requests_seconds_* feed the SLIs in docs/reliability.md §1.
  prometheus:
    config:
      scrape_configs:
        - job_name: octo-api
          scrape_interval: 30s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["api:8081"]

processors:
  # Refuse data before the container's 256M limit kills the process; first in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [debug]
