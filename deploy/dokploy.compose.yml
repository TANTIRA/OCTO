# OCTO app stack — Dokploy github-source build.
# Dokploy clones the repo and runs `docker compose -f deploy/dokploy.compose.yml`,
# building octo-api/octo-web on the host. Datastores live on dokploy-network
# (octo-supabase-db, octo-supabase-pooler, octo-neo4j-db). No public ports — domains
# route through Dokploy Traefik.
name: octo

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${API_IMAGE:-octo-api}:${API_IMAGE_TAG:?API_IMAGE_TAG must be set — see deploy/README.md}
    restart: unless-stopped
    environment:
      # List form on purpose: bare names pass through only when set in the Dokploy env, so
      # Spring's @ConditionalOnProperty("HELIUS_RPC_URL"/"ARBITRUM_RPC_URL") stays off until the
      # vendor keys are provisioned — an empty string would wrongly enable the beans.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_HOST=${POSTGRES_HOST}
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-postgres}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_MIGRATION_USER=${DB_MIGRATION_USER}
      - DB_MIGRATION_PASSWORD=${DB_MIGRATION_PASSWORD}
      - AUTH_ISSUER=${AUTH_ISSUER}
      - AUTH_JWKS_URL=${AUTH_JWKS_URL}
      - AUTH_AUDIENCE=${AUTH_AUDIENCE:-authenticated}
      # No SUPABASE_* or NEO4J_* here: nothing in the api reads them (#340). A feature that needs
      # storage or the graph adds the credential it actually reads in its own PR.
      - OPENROUTER_API_KEY
      - DECISION_MODEL
      - DECISION_MODEL_ENDPOINT
      # Comma-separated JWT subjects allowed to provision tenants (admin API). Unset = nobody.
      - OCTO_PLATFORM_ADMINS=${OCTO_PLATFORM_ADMINS:-}
      - HELIUS_API_KEY
      - HELIUS_RPC_URL
      - HELIUS_WALLET_API_URL
      - HELIUS_NETWORK
      - HELIUS_WEBHOOK_SECRET
      - ALPHA_VANTAGE_API_KEY
      - ALPHA_VANTAGE_BASE_URL
      - ARBITRUM_RPC_URL
      - ARBITRUM_API_KEY
      - ARBITRUM_CHAIN_ID
      - ARBITRUM_START_BLOCK
      - ARBITRUM_MAX_BLOCK_WINDOW
      - ARBITRUM_POLL_MS
      - ARBITRUM_POLL_INITIAL_DELAY_MS
      # Per-tenant rate-limit counters (RateLimitFilter). Point at the shared dokploy-network
      # Redis if one is provisioned, or the octo-redis service below.
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - OCTO_RATE_LIMIT_PER_MINUTE=${OCTO_RATE_LIMIT_PER_MINUTE:-120}
      # Agent sidecar (ADR-0005) — api → agents calls stay on dokploy-network. Unset base
      # URL makes agent endpoints answer 503; the token is shared with the agents service.
      - OCTO_AGENTS_BASE_URL=${OCTO_AGENTS_BASE_URL:-http://agents:8080}
      - OCTO_AGENTS_TOKEN=${OCTO_AGENTS_TOKEN}
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  # Python agent sidecar (ADR-0005) — AIP workflow orchestration. Internal only:
  # no Traefik labels, so no public route — the api reaches it on
  # dokploy-network like the neo4j datastore. Feature-flagged per workflow.
  agents:
    build:
      context: ../agents
      dockerfile: Dockerfile
    image: ${AGENTS_IMAGE:-octo-agents}:${AGENTS_IMAGE_TAG:?AGENTS_IMAGE_TAG must be set — see deploy/README.md}
    restart: unless-stopped
    environment:
      - OPENROUTER_API_KEY
      - OCTO_API_BASE_URL=http://api:8080
      # Plaintext hop is confined to dokploy-network (TLS ends at Traefik) —
      # the sidecar refuses http:// without this explicit opt-in (#345).
      - OCTO_AGENTS_INSECURE_HTTP=true
      - OCTO_AGENT_TOKEN=${OCTO_AGENT_TOKEN}
      - OCTO_AGENTS_TOKEN=${OCTO_AGENTS_TOKEN}
      - OCTO_AGENTS_SCREENING_DD_ENABLED=${OCTO_AGENTS_SCREENING_DD_ENABLED:-false}
      - OCTO_AGENTS_DD_ENABLED=${OCTO_AGENTS_DD_ENABLED:-false}
      - OCTO_AGENTS_IC_MEMO_ENABLED=${OCTO_AGENTS_IC_MEMO_ENABLED:-false}
      - OCTO_AGENTS_LP_REPORT_ENABLED=${OCTO_AGENTS_LP_REPORT_ENABLED:-false}
      - OCTO_AGENTS_BRAIN_ENABLED=${OCTO_AGENTS_BRAIN_ENABLED:-false}
      - OCTO_AGENTS_COMPLIANCE_ENABLED=${OCTO_AGENTS_COMPLIANCE_ENABLED:-false}
      - OCTO_AGENTS_EQUITY_BRIDGE_ENABLED=${OCTO_AGENTS_EQUITY_BRIDGE_ENABLED:-false}
      - OCTO_AGENTS_CALIBRATION_ENABLED=${OCTO_AGENTS_CALIBRATION_ENABLED:-false}
    networks:
      - default
      - dokploy-network
    # api's readiness healthcheck must pass before the sidecar boots — a bare
    # depends_on raced the JVM and lost runs to connection-refused.
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  # Quota counters for RateLimitFilter — internal only (no Traefik labels, no host port).
  # Losing its data resets current-minute counters; nothing durable lives here, so no volume.
  redis:
    # Pinned by version + digest (infra/README.md guardrails). Bump both together:
    #   docker buildx imagetools inspect redis:7.4.11-alpine --format '{{.Manifest.Digest}}'
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle by next build; publishable anon key.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-}
        # Also baked at build: rewrites() reads it when next.config evaluates.
        API_INTERNAL_URL: http://api:8080
    image: ${WEB_IMAGE:-octo-web}:${WEB_IMAGE_TAG:?WEB_IMAGE_TAG must be set — see deploy/README.md}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_PUBLIC_URL}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL}
    networks:
      - default
      - dokploy-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the standalone server binds IPv4 0.0.0.0 and
      # busybox wget tries ::1 first on alpine, which reports unhealthy falsely.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

# Graph store: the external octo-neo4j-db Dokploy service (bolt :7687 on
# dokploy-network). It lives outside this compose so Browser and the app share
# one graph; bolt stays private — Traefik only exposes labelled HTTP services.

networks:
  dokploy-network:
    external: true
