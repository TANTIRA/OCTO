# Testcontainers 1.21.3 defaults the Docker API to 1.32 when none is set, and
# Docker Engine 29 (Docker Desktop 4.91+) rejects anything below 1.40.
# 1.40 is the lowest version Engine 29 accepts and old enough for any daemon
# still in the field (Docker >= 19.03). Same fix as modules/api.
api.version=1.40
