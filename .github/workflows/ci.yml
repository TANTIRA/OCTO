name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check
        run: ./gradlew check

      # TODO(issue): TypeQL schema validation for ontology/mesta-investment.tql
      # TODO(issue): AI eval gate once eval sets land (see docs/ai-architecture.md)
