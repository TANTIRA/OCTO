# Trivy suppressions for the octo-api image scan (.github/workflows/ci.yml, docker-scan job).
# Each entry needs a statement and an expired_at, so it drops back into the Security tab for re-triage.
vulnerabilities:
  - id: CVE-2026-35371
    purls:
      - "pkg:deb/ubuntu/rust-coreutils"
    statement: >-
      False positive. Ubuntu still lists 26.04 as "needs fix", but upstream fixed uu_id in 0.6.0
      (GitLab advisory for cargo/uu_id). Dockerfile's Temurin JRE ships rust-coreutils
      0.10.0-1ubuntu2~26.04.1, which is past that fix. CVSS 3.3, local only. Alert #81.
    expired_at: 2027-01-31

  # rust-coreutils 0.10.0-1ubuntu2~26.04.1 in the pinned Temurin JRE (Dockerfile).
  # Debian's tracker marks each of these fixed in rust-coreutils 0.10.0-1; the 0.10.0
  # release is the upstream fix. Trivy leaves Fixed Version empty, so it still reports
  # the patched package. Alerts 65-80 and 82-84.
  - id: CVE-2026-35341
    purls: ["pkg:deb/ubuntu/rust-coreutils"]
    statement: >-
      False positive. Dockerfile pins eclipse-temurin:21.0.12.1_1-jre, which ships
      rust-coreutils 0.10.0-1ubuntu2~26.04.1. Debian marks CVE-2026-35341 fixed in
      rust-coreutils 0.10.0-1 (upstream 0.10.0). The installed package is that fix.
      Code scanning alert #65.
    expired_at: 2027-01-31
