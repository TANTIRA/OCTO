  - id: CVE-2026-85091
    purls: ["pkg:deb/ubuntu/zlib1g"]
    statement: >-
      False positive. Dockerfile's Temurin JRE ships zlib1g
      1:1.3.dfsg+really1.3.1-1ubuntu3.1 (upstream zlib 1.3.1). CVE-2026-85091 is
      gz_vacate() in zlib 1.3.1.2 through 1.3.2; Debian marks older zlib
      not-affected because that code landed in 1.3.1.2. Alert #88.
    expired_at: 2027-01-31

  - id: CVE-2026-89092
    purls:
      - "pkg:deb/ubuntu/libc-bin"
      - "pkg:deb/ubuntu/libc-gconv-modules-extra"
      - "pkg:deb/ubuntu/libc6"
      - "pkg:deb/ubuntu/locales"
    statement: >-
      False positive. GLIBC-SA-2026-0016 is a stack overflow in the nscd daemon.
      The octo-api image (Dockerfile) does not install the nscd package; Trivy
      attributes the glibc source advisory to libc6, libc-bin, locales, and
      libc-gconv-modules-extra, which do not contain nscd. Alerts #9, #11, #13, #34.
    expired_at: 2027-01-31

  - id: CVE-2026-40228
    purls:
      - "pkg:deb/ubuntu/libsystemd0"
      - "pkg:deb/ubuntu/libudev1"
    statement: >-
      False positive. CVE-2026-40228 is systemd-journald writing unescaped emerg
      messages when ForwardToWall=yes. The Dockerfile JRE image installs
      libsystemd0 and libudev1 only; the systemd-journald package is not present.
      Alerts #31 and #32.
    expired_at: 2027-01-31
