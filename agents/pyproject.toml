[project]
name = "octo-agents"
version = "0.1.0"
description = "OCTO Python agent sidecar — AIP workflow orchestration (ADR-0005)"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-openrouter>=0.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["octo_agents"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in argument defaults is FastAPI's dependency-injection idiom — the
# call produces a marker FastAPI resolves per-request, not an eager default.
extend-immutable-calls = ["fastapi.Depends"]
